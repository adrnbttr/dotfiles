# Sessions WezTerm : un workspace par session.
# Format : <workspace> <commande zsh> [# description]
# Lu par bin/.local/bin/wez-pick (sélecteur ctrl+shift+s, reprise au démarrage).
# Les fonctions elles-mêmes vivent dans zsh/.zshrc.

de      de-session      # worktrees data-engineering
ms      ms-session      # worktrees marvin-suite
marvin  marvin-session  # data-engineering + marvin-suite + keystone
github  github-session  # dépôts perso (~/Documents/github/perso)
