name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh shellcheck

      - name: Validate zshrc
        run: zsh -n zsh/.zshrc

      - name: Shellcheck scripts
        # -x : suit les fichiers sourcés (script/lib-ui.sh)
        run: |
          shellcheck -x \
            script/bootstrap \
            script/doctor \
            script/get \
            script/install \
            script/lib-ui.sh \
            script/claude \
            script/install-claude \
            claude/.claude/skills/lead/scripts/lead-start.sh \
            claude/.claude/skills/lead/scripts/lead-stop.sh \
            claude/.claude/skills/lead/hooks/stop-lead.sh \
            bin/.local/bin/wez-pick \
            bin/.local/bin/nvim-agent \
            tests/nvim-agent/run.sh \
            tests/nvim-agent/lib.sh \
            tests/nvim-agent/script_test.sh \
            tests/nvim-agent/lua_request_test.sh \
            tests/nvim-agent/measure_tree.sh \
            tests/nvim-agent/fakes/fake-agent

      - name: Install steps are listable
        run: ./script/install --list

      - name: Install dry-run
        run: ./script/install --dry-run --no-gui --no-opencode --no-claude
